<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE PROXY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(circle at top,#252015,#090909 65%);
  color:#f5f0e5;font-family:Arial,sans-serif;padding:24px
}
.card{
  width:min(520px,100%);padding:38px 28px;text-align:center;
  background:#111;border:1px solid #8c713c;border-radius:22px;
  box-shadow:0 0 45px #b18b3820
}
.logo{font-size:14px;letter-spacing:7px;color:#c9a75c}
h1{font-size:38px;letter-spacing:3px;margin:22px 0 8px}
.sub{color:#aaa}
.line{height:1px;background:#554526;margin:28px 0}
.item{display:flex;justify-content:space-between;padding:14px 4px;
border-bottom:1px solid #292929}
.label{color:#999}
.value{color:#d7b66d}
.note{font-size:12px;color:#888;margin-top:25px;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="logo">PREMIUM NETWORK</div>
  <h1>CORE PROXY</h1>
  <div class="sub">Your connection. Your freedom.</div>
  <div class="line"></div>
  <div class="item"><span class="label">Тип</span><span class="value">MTProto</span></div>
  <div class="item"><span class="label">Регион</span><span class="value">Frankfurt, DE</span></div>
  <div class="item"><span class="label">Статус сайта</span><span class="value">ONLINE</span></div>
  <div class="item"><span class="label">Прокси</span><span class="value">NOT CONNECTED</span></div>
  <div class="note">CORE PROXY © 2026<br>Панель проекта. Подключение прокси пока не настроено.</div>
</main>
</body>
</html>
